{% macro buckets(rows, series, title, denominator) %}
{% set ns=namespace(peak=2) %}{% for r in rows %}{% set ns.peak=[ns.peak,r.total]|max %}{% endfor %}
<div class="ops-chart" data-chart><h3>{{title}}</h3><div class="ops-chart-scroll"><svg viewBox="0 0 720 178" role="group" aria-label="{{title}} · counts per hourly interval"><text x="45" y="14" class="ops-axis">count / hour</text>{% for f in [0,1] %}<line x1="45" x2="700" y1="{{130-100*f}}" y2="{{130-100*f}}" class="ops-grid"/><text x="38" y="{{134-100*f}}" text-anchor="end" class="ops-axis">{{(ns.peak*f)|int}}</text>{% endfor %}{% for r in rows %}{% set x=48+loop.index0*650/[1,rows|length]|max %}{% set h=namespace(offset=0,tip=(r.start|recorded_time)~' · ') %}{% for key,label in series %}{% set h.tip=h.tip~label~': '~r.get(key,0)~'; ' %}{% endfor %}<g tabindex="0" role="img" aria-label="{{h.tip}}" data-tip="{{h.tip}}"><title>{{h.tip}}</title><rect x="{{x}}" y="25" width="{{650/[1,rows|length]|max}}" height="110" class="ops-target"/>{% for key,label in series %}{% set value=r.get(key,0) %}<rect x="{{x+3}}" y="{{130-(h.offset+value)/ns.peak*100}}" width="{{[1,650/[1,rows|length]|max-6]|max}}" height="{{value/ns.peak*100}}" class="ops-series-{{loop.index0}}"/>{% set h.offset=h.offset+value %}{% endfor %}</g>{% if loop.index0 in [0,6,12,18] %}<text x="{{x}}" y="151" class="ops-axis">{{r.start|recorded_time}}</text>{% endif %}{% endfor %}</svg></div><p class="ops-hover" aria-live="polite">{{denominator}}</p><p class="ops-legend">{% for key,label in series %}<span class="ops-key-{{loop.index0}}">{{label}}</span>{% endfor %}</p></div>
{% endmacro %}
